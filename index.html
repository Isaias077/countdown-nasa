<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown to October 5th 23:59</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .watermark-cover {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 150px;
      height: 40px;
      background-color: black;
      z-index: 1000;
    }
  </style>
</head>

<body>
  <div class="count">
    <div class="test"></div>
    <div>
      <img src="./LogoNSAC.png" width="300px">
      <div id="countdown"></div>
    </div>
  </div>
  <video id="backgroundVideo" autoplay muted playsinline>
    <source src="VideoFondoEnLoop.mp4" type="video/mp4">
    Tu navegador no soporta el video.
  </video>
  
  <div class="watermark-cover"></div>


  <script>
    function countdownToMidnight() {
      const now = new Date();
      /////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
      //                   Modificando estos valores, pueden establecer cuando se acaba el contador                              //
      //                          AÑO  MES DIA HORA MIN SEG MILISEGUNDOS                                                         //
      const targetDate = new Date(2025, 9,  5,  23, 59, 59, 999); // 5 de octubre 2025, 23:59:59 (mes 9 = octubre)               //
      //                                                                                                                         //
      /////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
      const difference = targetDate - now;

      const hours = Math.floor(difference / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);

      document.getElementById("countdown").innerHTML = `${hours}h ${minutes}m ${seconds}s`;

      console.log({ difference });

      if (difference <= 1000) {
      /////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
      //                                                                                                                         //
      //         Modificando el texto de ¡TIEMPO! van a poder personalizar el mensaje al agotarse el tiempo                      //
      //                                                                                                                         //
      /////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
        document.getElementById("countdown").innerHTML = "¡TIEMPO!";
        clearInterval(intervalId);
      }
    }

    countdownToMidnight();
    const intervalId = setInterval(countdownToMidnight, 1000);

    const video = document.getElementById("backgroundVideo");
    let isReversing = false; // Indica si el video está en reversa

    // Función para alternar avance y retroceso
    function toggleDirection() {
      if (isReversing) {
        video.currentTime -= 0.06; // Retrocede en pequeños pasos
        if (video.currentTime <= 0) {
          isReversing = false; // Cambia a avance cuando llega al principio
        }
      } else {
        video.currentTime += 0.06; // Avanza en pequeños pasos
        if (video.currentTime >= video.duration) {
          isReversing = true; // Cambia a retroceso cuando llega al final
        }
      }
    }

    // Ejecuta toggleDirection cada 50 ms
    const interval = setInterval(toggleDirection, 50);

    // Inicia el video en silencio y en modo autoplay
    video.muted = true;
    video.play();

  </script>
</body>

</html>
